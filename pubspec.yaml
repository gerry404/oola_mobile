name: oola_mobile
description: "OOLAshop - marketplace video Cote d'Ivoire"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Etat / DI (architecture officielle Flutter : MVVM + provider)
  provider: ^6.1.2
  logging: ^1.3.0

  # Reseau
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Modeles
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Stockage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Securite
  local_auth: ^2.3.0
  # Anti-capture d'ecran : implemente en natif (FLAG_SECURE Android) via
  # MethodChannel, sans dependance plugin (voir core/security/secure_screen.dart).

  # Video
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2

  # Media (vendeur)
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Divers
  intl: ^0.20.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

  # Push (a activer avec la config Firebase - voir docs/PUSH.md)
  # firebase_core: ^3.8.0
  # firebase_messaging: ^15.1.5
  # flutter_local_notifications: ^18.0.1

  # Compression video cote vendeur (a activer au module video)
  # video_compress: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/

flutter_native_splash:
  color: "#FDF8F8"
  image: assets/brand/oola-mark.png
  android_12:
    color: "#FDF8F8"
    image: assets/brand/oola-mark.png
  android: true
  ios: true
